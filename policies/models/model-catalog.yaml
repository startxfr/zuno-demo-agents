# Model catalog: the model vocabulary agent bundles may name.
#
# Corp policy, owned by this repository (ADR-0576, as amended on
# 2026-10-22: the agents repository defines its own vocabulary). Each entry
# is a logical model name that policies/model-routing/model-routing-policy.yaml
# may prefer, with the facts routing decisions depend on:
#   kind          local (served in-cluster) or saas (leaves the cluster)
#   model         the model that answers, for humans reading the matrices
#   role          architectural role (default, quality, reasoning, ...)
#   eligible_for  data classifications allowed to reach it (C1 < C2 < C3)
#
# Order matters: it is the default fallback order within a classification,
# local models first.
#
# This file says nothing about HOW a model is reached (endpoints, MaaS refs,
# credentials). A consuming platform binds each name to a real backend and
# must refuse, at admission, a release naming a model it cannot serve.
#
# Seeded on 2026-10-22 from zuno-demo platform/ai-gateway/provider-routing.yaml
# (commit 9b5507c6), keeping only the logical fields.

models:
