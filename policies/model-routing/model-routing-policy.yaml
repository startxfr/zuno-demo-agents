# Model routing policy (ADR-0303 adapters, ADR-0304 objectives, ADR-0412 preferences).
# Read by the AI Gateway (components/ai-gateway/app/model_routing_policy.py), baked into its image.
#
# How a chain is resolved for an (agent, task):
#   1. provider-routing.yaml gives the candidates eligible for the turn's classification (ADR-0021);
#      `local_only_for` drops every non-local candidate at the listed levels (WP-187).
#   2. `preferred`/`prefer` moves the names it lists to the front, in that order (ADR-0412). It only reorders
#      the survivors and never brings back a removed provider. Unlisted survivors follow in provider-routing
#      order; unknown names are ignored with a warning. `fallback` lists the names tried after them.
#   3. Always list a `-maas` name right before its direct twin (ADR-0521): MaaS first, same model direct as fallback.
# The task's own `models.preferred` roles (task frontmatter) only reorder the same candidates.
#
# Three families:
#   reasoning  gpt-oss first (ovhcloud-gpt-oss-120b ahead of it when C1/C2 may leave the cluster): tekos
#              answer-technical-question, arkos documents (ADR-0416, ADR-0550).
#   general    qwen3.5-9b first, gpt-oss second (ADR-0531): advantage, finage, naveo, soursage, cognos, tekos lookups.
#              Comage leads with the qwen3.5-9b-wesh fine-tune (ADR-0526 decision 7).
#   code       write-code: tekos prefers mistral-codestral (checked by evaluations/tekos/gate_checks.py, keep it
#              first and non-strict), arkos stays on local gpt-oss.
#
# Adapters are empty until a real LoRA module is registered (ADR-0303): an entry here must name an existing one.
adapters: []

preferences:
  # Multi-doc synthesis with citations. Reads Confluence and the docs: never leaves the cluster (WP-187).
  - agent: tekos
    task: answer-technical-question
    preferred: [ovhcloud-gpt-oss-120b, local-gpt-oss-maas, local-gpt-oss, local-qwen35-maas, local-qwen35, local-wesh-maas, local-wesh, local-maas, local]
    fallback: &saas [openai, gemini, anthropic, mistral]
    local_only_for: &all_levels [C1, C2, C3]
  # Lookups: qwen3.5-9b first, its wesh fine-tune right behind (ADR-0526).
  - agent: tekos
    task: find-relevant-docs
    preferred: &tekos_lookup [local-qwen35-maas, local-qwen35, local-wesh-maas, local-wesh, local-maas, local, local-gpt-oss-maas, local-gpt-oss, ovhcloud-gpt-oss-120b]
    fallback: *saas
    local_only_for: *all_levels
  - agent: tekos
    task: check-my-drive-docs
    preferred: *tekos_lookup
    fallback: *saas
  # Arkos document workflow (plan, draft, reflect, write): C2/C3 never externalised (ADR-0550 decision 3, WP-187).
  - agent: arkos
    task: draft-architecture-testimonial
    prefer: &arkos_docs [ovhcloud-gpt-oss-120b, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
    local_only_for: *all_levels
  - agent: arkos
    task: workshop-presentation
    prefer: *arkos_docs
    local_only_for: *all_levels
  # Not moved to the qwen3.5 default on purpose: a known 30 s streaming timeout (WP-31) is its own investigation.
  - agent: arkos
    task: structure-demo
    preferred: [local-maas, local]
    fallback: [local-gpt-oss-maas, local-gpt-oss, local-wesh-maas, local-wesh, local-qwen35-maas, local-qwen35]
  # Comage: wesh fine-tune first on all three tasks (one entry per task, there is no agent-level default).
  # Tool-calling tasks: the serving runtime must keep a tool-call parser (gitops/charts/models).
  - agent: comage
    task: check-deal-status
    preferred: &wesh_first [local-wesh-maas, local-wesh, local-qwen35-maas, local-qwen35, local-maas, local, local-gpt-oss-maas, local-gpt-oss]
  - agent: comage
    task: update-opportunity-status
    preferred: *wesh_first
  - agent: comage
    task: check-my-drive-and-mail
    preferred: *wesh_first
  # General family (ADR-0531): qwen3.5-9b leads, gpt-oss is a fallback and not a protected reasoning override.
  - agent: advantage
    task: answer-project-question
    preferred: &general [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  - agent: advantage
    task: identify-new-business-with-po
    preferred: *general
  - agent: advantage
    task: monthly-sales-report
    preferred: *general
  - agent: advantage
    task: check-my-drive-and-mail
    preferred: *general
  - agent: finage
    task: identify-business-ready-to-invoice
    preferred: *general
  - agent: finage
    task: monthly-invoice-report
    preferred: *general
  - agent: finage
    task: answer-finance-question
    preferred: *general
  - agent: finage
    task: check-my-drive-and-mail
    preferred: *general
  # Placeholder agents: cognos may reach OVHcloud first, soursage is general.
  - agent: cognos
    task: coming-soon
    preferred: [ovhcloud-gpt-oss-120b, local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  - agent: naveo
    task: answer-onboarding-question
    preferred: *general
    local_only_for: *all_levels
  - agent: soursage
    task: coming-soon
    preferred: *general
  # Code: arkos is local only (C3 agent); tekos prefers mistral-codestral, wesh no longer preferred (2026-11-14).
  - agent: arkos
    task: write-code
    preferred: [local-gpt-oss-maas, local-gpt-oss]
    fallback: [local-maas, local]
    local_only_for: *all_levels
  - agent: tekos
    task: write-code
    prefer: [mistral-codestral, local-gpt-oss-maas, local-gpt-oss, local-maas, local]

# ADR-0304 objectives, read by evaluations/routing_report.py. quality_floor comes from
# evaluations/comage/gate_config.yaml (scenario_threshold); cost and latency targets stay omitted until the OTel
# collector has a queryable metrics store.
objectives:
  - agent: comage
    task: check-deal-status
    quality_floor: 0.75
  - agent: comage
    task: update-opportunity-status
    quality_floor: 0.75
  - agent: comage
    task: check-my-drive-and-mail
    quality_floor: 0.75
