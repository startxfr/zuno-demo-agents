# Corp policy: limits - ceilings for the per-agent and per-task bounds an
# OKF v0.3 bundle may declare under `zuno.limits` (zuno-demo ADR-0579
# clause 4). A bundle may only ask for less.
#
# Quota amounts are not here: they live in policies/quotas/quota-policy.yaml,
# and `zuno.limits.quota_class` only selects one of its classes.

# Generation ceiling per model call (ADR-0544). Same bound as the OKF task
# schema's zuno.max_tokens maximum.
max_tokens: 8192

# Concurrent requests one user may keep open on one agent. Seed value: no
# platform enforces it yet; it is the bound a bundle is checked against.
max_concurrent_requests: 10

# Reasoning/tool rounds of one agent turn (zuno.limits.max_steps, agent or
# task level). unifai-operator bounds an agent that declares nothing to 15
# rounds and executes an identical tool call at most twice per run; 30 leaves
# room for complex tasks while bounding loops (a tekos turn once looped about
# 50 rounds, zuno-demo scenario #11, 2026-10-25).
max_steps: 30

# Model tokens of one agent turn (zuno.limits.max_tokens_per_turn, agent or task level). No corp ceiling is set: an
# agent that declares nothing has none (today's behaviour). Uncomment to bound every bundle, for example:
# max_tokens_per_turn: 120000

# Agent-to-agent delegation (zuno-demo ADR-0406). Ceiling on the hops a chain
# may have: a bundle's `zuno.limits.delegation.max_depth` may not exceed it.
# The default for an agent that declares nothing is 1 (it may call a target; the
# target may not call anyone).
max_delegation_depth: 2

delegation:
  # Legacy global switch: whether any delegated call may use write or destructive tools without a
  # listed target. Stays false; superseded by write_allowed below (zuno-demo ADR-0409 clause 5).
  allow_write: false
  # Targets a delegated call may write through, each write asking the initiating user for approval
  # (zuno-demo ADR-0409). A write tool is offered and allowed only when the executing agent/task is
  # listed. Every later target stays read-only until reviewed and listed here.
  # The entry is the TARGET of a delegation: Arkos delegates to Tekos, and the only write tool Tekos
  # carries is aap.cluster.audit (a Day 0 health check run through AAP). Nothing delegates to Arkos, so an
  # arkos entry could never be reached.
  write_allowed:
    - agent: tekos
      task: answer-technical-question

