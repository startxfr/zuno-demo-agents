# Publish a release: started by the vX.Y.Z tag that release.yml pushes.
#
# Consumers trust exactly this workflow on a release tag: their verification
# policy is the certificate identity
#   ^https://github.com/startxfr/zuno-demo-agents/.github/workflows/publish.yml@refs/tags/v
# issued by https://token.actions.githubusercontent.com (zuno-demo ADR-0578).
# Do not rename this file without changing that policy.
name: Publish release

on:
  push:
    tags: ["v*"]
  # Recovery only: run it with a release tag as the ref ("Use workflow
  # from: Tags > vX.Y.Z"). From a branch the tag check below fails, and the
  # signature identity (refs/heads/...) would not be a release one anyway.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: publish
    if: vars.OKF_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      OKF_REGISTRY: ${{ vars.OKF_REGISTRY || 'quay.io/zuno' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is the VERSION of its tree
        run: test "$GITHUB_REF_TYPE" = tag && test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml==6.0.2 jsonschema==4.23.0
      - name: Checks, on the exact tree being released
        run: |
          python3 platform/okf/validate_okf_schema.py
          python3 platform/supply-chain/validate_okf_bundle.py
          python3 platform/okf/validate_quota_policy.py
          python3 platform/okf/check_narrowing.py
          python3 platform/okf/tests/test_okf_v03.py
          python3 platform/okf/generate_authorization_matrix.py --check --all
          python3 platform/okf/run_agent_contract_tests.py
          python3 -m unittest discover -s platform/release/tests
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.2
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Log in to the registry
        env:
          QUAY_USER: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          host="${OKF_REGISTRY%%/*}"
          echo "$QUAY_TOKEN" | oras login "$host" -u "$QUAY_USER" --password-stdin
          echo "$QUAY_TOKEN" | cosign login "$host" -u "$QUAY_USER" --password-stdin
      - name: Publish the agents and the corp artifact
        id: refs
        run: |
          python3 platform/release/okf_release.py publish \
            --registry "$OKF_REGISTRY" --channel release --sha "$GITHUB_SHA" --output refs.json
          corp="$(jq -r .corp refs.json)"
          echo "corp_name=${corp%@*}" >> "$GITHUB_OUTPUT"
          echo "corp_digest=${corp#*@}" >> "$GITHUB_OUTPUT"
      - name: Sign keyless
        run: jq -r '.corp, .agents[]' refs.json | xargs -n1 cosign sign --yes
      - name: Attest the checks that passed
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg release "$GITHUB_REF_NAME" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{commit: $commit, release: $release, run: $run,
              checks: ["validate_okf_schema", "validate_okf_bundle", "validate_quota_policy", "check_narrowing",
                       "generate_authorization_matrix --check", "run_agent_contract_tests", "release tooling tests"]}' \
            > predicate.json
          jq -r '.corp, .agents[]' refs.json \
            | xargs -I{} cosign attest --yes --type https://zuno.startx.fr/okf/contract-tests/v1 --predicate predicate.json {}
      - name: Attest build provenance of the release
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.refs.outputs.corp_name }}
          subject-digest: ${{ steps.refs.outputs.corp_digest }}
          push-to-registry: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="## $GITHUB_REF_NAME " 'index($0, tag) == 1 {on = 1; next} /^## v/ {on = 0} on' CHANGELOG.md > notes.md
          {
            echo
            echo "Corp artifact (pin this): \`$(jq -r .corp refs.json)\`"
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md refs.json
